<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones Matemáticas</title>
    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="misFunciones.js"></script>
</head>

<body class="body-num">

<div class="centrado div-conver">
    <h1>Operaciones Matemáticas</h1>

    <form class="operacionesMat">

        <p>
            <input id="nums1" type="text" onchange="sumar()">
            +
            <input id="nums2" type="text" onchange="sumar()">
            =
            <input id="totalS" type="text" disabled>
        </p>

        <p>
            <input id="numr1" type="text" onchange="restar()">
            -
            <input id="numr2" type="text" onchange="restar()">
            =
            <input id="totalR" type="text" disabled>
        </p>

        <p>
            <input id="numm1" type="text" onchange="multiplicar()">
            x
            <input id="numm2" type="text" onchange="multiplicar()">
            =
            <input id="totalM" type="text" disabled>
        </p>

        <p>
            <input id="numd1" type="text" onchange="dividir()">
            /
            <input id="numd2" type="text" onchange="dividir()">
            =
            <input id="totalD" type="text" disabled>
        </p>

    </form>
</div>

</body>
</html>
