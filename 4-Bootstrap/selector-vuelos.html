<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selección de fechas de vuelos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="selector-vuelos.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid p-3">
    <div class="dropdown">
      <button class="btn btn-primary dropdown-toggle" type="button" id="selector-fecha" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Selecciona la fecha</button>
      <div class="dropdown-menu p-4 calendar-container" aria-labelledby="selector-fecha">
        <h1 class="h3 text-center mb-4">Fechas de Vuelos</h1>
        <div class="d-flex justify-content-between align-items-center gap-2 mb-4">
          <button class="btn btn-outline-secondary" type="button" id="anterior" aria-label="Mes anterior">&#10094;</button>
          <button class="btn btn-outline-secondary" type="button" id="siguiente" aria-label="Mes siguiente">&#10095;</button>
        </div>
        <div class="row g-4">
          <section class="col-12 col-md-6" aria-labelledby="mes-0">
            <h2 class="h5 fw-bold mb-3" id="mes-0"></h2>
            <div class="calendar-grid" id="calendario-0"></div>
          </section>
          <section class="col-12 col-md-6 segundo-mes" aria-labelledby="mes-1">
            <h2 class="h5 fw-bold mb-3 text-md-end" id="mes-1"></h2>
            <div class="calendar-grid" id="calendario-1"></div>
          </section>
        </div>
        <div class="d-flex justify-content-between gap-2 mt-4">
          <button class="btn btn-outline-secondary" type="button" id="cancelar">Cancelar</button>
          <button class="btn btn-outline-primary" type="button" id="guardar" disabled>Guardar</button>
        </div>
      </div>
    </div>
    <p class="mt-3 text-secondary" id="resultado" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="selector-vuelos.js"></script>
</body>
</html>
