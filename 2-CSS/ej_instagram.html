<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">

    <style>
        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .galeria img {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 600px) {
            .galeria {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="galeria">
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png" alt="Tigre blanco entre plantas">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_02.png" alt="Jardín con árboles y un estanque">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_03.png" alt="Paisaje de montañas bajo el cielo azul">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_04.png" alt="Atardecer sobre un paisaje montañoso">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_05.png" alt="Monumento con inscripciones japonesas junto a árboles en flor">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_06.png" alt="Estatua de la Libertad iluminada de noche">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_07.png" alt="Cámara fotográfica frente a un paisaje verde">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_08.png" alt="Puerta torii en el agua al atardecer">
        </div>
        <div>
            <img src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_09.png" alt="Canal de Venecia con edificios iluminados">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script>
</body>
</html>
