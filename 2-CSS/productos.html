
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        main {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tarjeta {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 15px;
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <h1>Productos deportivos</h1>

    <main>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Casco" alt="Casco">
            <h3>Casco</h3>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Escudo" alt="Escudo">
            <h3>Escudo de potencia</h3>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Protector" alt="Protector">
            <h3>Protector deportivo</h3>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Guantes" alt="Guantes">
            <h3>Guantes</h3>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Uniforme" alt="Uniforme">
            <h3>Uniforme</h3>
        </div>

        <div class="tarjeta">
            <img src="https://placehold.co/300x200?text=Protecciones" alt="Protecciones">
            <h3>Protecciones</h3>
        </div>

    </main>

</body>

</html>
