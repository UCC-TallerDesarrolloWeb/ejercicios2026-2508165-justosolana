
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <style>
        :root {
            --color-catalogo: #8b211e;
            --color-carrito: #25227a;
            --color-hover: #444444;
            --color-texto: white;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-areas:
                "cabecera cabecera cabecera cabecera"
                "links links links links"
                "aside main main main"
                "footer footer footer footer";
            gap: 10px;
            padding: 10px;
        }

        .item1 {
            grid-area: cabecera;
        }

        .item2 {
            grid-area: links;
        }

        .item3 {
            grid-area: aside;
        }

        .item4 {
            grid-area: main;
        }

        .item5 {
            grid-area: footer;
        }

        /* Botones de navegación */
        .boton {
            color: var(--color-texto);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease, padding 0.3s ease;
        }

        .catalogo {
            background-color: var(--color-catalogo);
        }

        .carrito {
            background-color: var(--color-carrito);
        }

        .boton:hover {
            background-color: var(--color-hover);
            padding: 15px;
        }

        /* Grilla de productos */
        .productos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .tarjeta {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        /* Panel de búsqueda */
        fieldset {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        fieldset input[type="text"],
        fieldset input[type="number"] {
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body class="grid-container">

    <header class="item1">
        <h1>Productos</h1>
    </header>

    <nav class="item2">
        <button type="button" class="boton catalogo">Catálogo</button>
        <button type="button" class="boton carrito">Carrito de Compras</button>
    </nav>

    <aside class="item3">

        <form>

            <fieldset>
                <legend>Búsqueda</legend>

                <label>
                    Buscar:
                    <input type="text" name="buscar">
                </label>
            </fieldset>

            <fieldset>
                <legend>Precios</legend>

                <label>
                    Mínimo:
                    <input type="number" name="minimo">
                </label>

                <label>
                    Máximo:
                    <input type="number" name="maximo">
                </label>
            </fieldset>

            <fieldset>
                <legend>Tipo de Productos</legend>

                <label>
                    <input type="checkbox" name="tipo" value="protectores">
                    Protectores
                </label>

                <label>
                    <input type="checkbox" name="tipo" value="entrenamiento">
                    Entrenamiento
                </label>

                <label>
                    <input type="checkbox" name="tipo" value="doboks">
                    Doboks
                </label>
            </fieldset>

        </form>

    </aside>

    <main class="item4">

        <div class="productos">

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Casco" alt="Casco">
                <h3>Casco</h3>
            </div>

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Escudo" alt="Escudo">
                <h3>Escudo de potencia</h3>
            </div>

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Protector" alt="Protector">
                <h3>Protector deportivo</h3>
            </div>

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Guantes" alt="Guantes">
                <h3>Guantes</h3>
            </div>

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Uniforme" alt="Uniforme">
                <h3>Uniforme</h3>
            </div>

            <div class="tarjeta">
                <img src="https://placehold.co/300x200?text=Protecciones" alt="Protecciones">
                <h3>Protecciones</h3>
            </div>

        </div>

    </main>

    <footer class="item5">
        <p>Pie de página</p>
    </footer>

</body>

</html>
