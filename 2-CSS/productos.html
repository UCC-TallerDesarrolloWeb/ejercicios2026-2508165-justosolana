<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <style>
        :root {
            --color-catalogo: #8b211e;
            --color-carrito: #25227a;
            --color-hover: #444444;
            --color-texto: white;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-areas:
                "cabecera cabecera cabecera cabecera"
                "links links links links"
                "aside main main main"
                "footer footer footer footer";
            gap: 10px;
            padding: 10px;
        }

        .item1 {
            grid-area: cabecera;
        }

        .item2 {
            grid-area: links;
        }

        .item3 {
            grid-area: aside;
        }

        .item4 {
            grid-area: main;
        }

        .item5 {
            grid-area: footer;
        }

        .boton {
            color: var(--color-texto);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .catalogo {
            background-color: var(--color-catalogo);
        }

        .carrito {
            background-color: var(--color-carrito);
        }

        .boton:hover {
            background-color: var(--color-hover);
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .tarjeta {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .tarjeta button {
            padding: 8px;
            margin: 5px;
            cursor: pointer;
        }

        fieldset {
            margin-bottom: 10px;
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
        }

        fieldset input[type="text"],
        fieldset input[type="number"],
        fieldset select {
            max-width: 100%;
            box-sizing: border-box;
        }

        dialog {
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            .grid-container {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "cabecera"
                    "links"
                    "aside"
                    "main"
                    "footer";
            }

            .productos {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="grid-container" onload="mostrarProductos()">

    <header class="item1">
        <h1>Productos</h1>
    </header>

    <nav class="item2">
        <button
            type="button"
            class="boton catalogo"
            onclick="window.location.href='productos.html'"
        >
            Catálogo
        </button>

        <button
            type="button"
            class="boton carrito"
            onclick="window.location.href='carrito.html'"
        >
            Carrito de Compras (<span id="contadorCarrito">0</span>)
        </button>
    </nav>

    <aside class="item3">
        <form onsubmit="event.preventDefault()">
            <fieldset>
                <legend>Búsqueda</legend>

                <label>
                    Buscar:
                    <input
                        type="text"
                        id="buscar"
                        oninput="filtrarProductos()"
                    >
                </label>
            </fieldset>

            <fieldset>
                <legend>Precios</legend>

                <label>
                    Mínimo:
                    <input
                        type="number"
                        id="minimo"
                        min="0"
                        oninput="filtrarProductos()"
                    >
                </label>

                <label>
                    Máximo:
                    <input
                        type="number"
                        id="maximo"
                        min="0"
                        oninput="filtrarProductos()"
                    >
                </label>
            </fieldset>

            <fieldset>
                <legend>Marca</legend>

                <label>
                    Seleccionar marca:
                    <select id="marca" onchange="filtrarProductos()">
                        <option value="">Todas</option>
                        <option value="Gran Marc">Gran Marc</option>
                        <option value="Daedo">Daedo</option>
                    </select>
                </label>
            </fieldset>

            <fieldset>
                <legend>Categoría</legend>

                <label>
                    <input
                        type="checkbox"
                        name="categoria"
                        value="Protectores"
                        onchange="filtrarProductos()"
                    >
                    Protectores
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="categoria"
                        value="Entrenamiento"
                        onchange="filtrarProductos()"
                    >
                    Entrenamiento
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="categoria"
                        value="Dobok"
                        onchange="filtrarProductos()"
                    >
                    Doboks
                </label>
            </fieldset>
        </form>
    </aside>

    <main class="item4">
        <label for="orden">Ordenar por:</label>

<select id="orden" onchange="filtrarProductos()">
    <option value="">Orden original</option>
    <option value="precio-asc">Precio: menor a mayor</option>
    <option value="precio-desc">Precio: mayor a menor</option>
    <option value="nombre-asc">Nombre: A-Z</option>
    <option value="nombre-desc">Nombre: Z-A</option>
</select>

<div class="productos" id="productos"></div>

        <dialog id="detalleProducto">
            <div id="contenidoDialog"></div>

            <button type="button" onclick="cerrarDialog()">
                Cerrar
            </button>
        </dialog>
    </main>

    <footer class="item5">
        <p>Pie de página</p>
    </footer>

    <script src="../3-Js/misFunciones.js"></script>
    <script src="../3-Js/tienda.js"></script>

</body>

</html>
