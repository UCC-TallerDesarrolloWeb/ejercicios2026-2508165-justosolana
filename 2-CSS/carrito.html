<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>

    <style>
        :root {
            --color-catalogo: #8b211e;
            --color-carrito: #25227a;
            --color-hover: #444444;
            --color-texto: white;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-areas:
                "cabecera cabecera cabecera cabecera"
                "links links links links"
                "main main main main"
                "footer footer footer footer";
            gap: 10px;
            padding: 10px;
        }

        .item1 {
            grid-area: cabecera;
        }

        .item2 {
            grid-area: links;
        }

        .item4 {
            grid-area: main;
        }

        .item5 {
            grid-area: footer;
        }

        .boton {
            color: var(--color-texto);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .catalogo {
            background-color: var(--color-catalogo);
        }

        .carrito {
            background-color: var(--color-carrito);
        }

        .boton:hover {
            background-color: var(--color-hover);
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .tarjeta {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        .tarjeta img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>

<body class="grid-container" onload="mostrarCarrito()">

    <header class="item1">
        <h1>Carrito de Compras</h1>
    </header>

    <nav class="item2">

        <button
            type="button"
            class="boton catalogo"
            onclick="window.location.href='productos.html'">
            Catálogo
        </button>

        <button
            type="button"
            class="boton carrito"
            onclick="window.location.href='carrito.html'">
            Carrito de Compras
        </button>

    </nav>

    <main class="item4">

        <h2>Productos en el carrito</h2>

        <div
            class="productos"
            id="carritoProductos">
        </div>

    </main>

    <footer class="item5">
        <p>Pie de página</p>
    </footer>

    <script src="../3-Js/tienda.js"></script>

</body>

</html>
