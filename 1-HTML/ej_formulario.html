<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
</head>

<body>

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

<form>

    <fieldset>
        <legend>Datos Personales</legend>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ingrese su nombre" maxlength="40" size="40">
        </p>

        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido"
                   placeholder="Ingrese su apellido" maxlength="40" size="40">
        </p>

        <p>
            Sexo:

            <input type="radio" id="masculino" name="sexo" value="masculino">
            <label for="masculino">Masculino</label>

            <input type="radio" id="femenino" name="sexo" value="femenino">
            <label for="femenino">Femenino</label>
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Edad">
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="Ingrese su email">
        </p>

    </fieldset>


    <fieldset>
        <legend>Datos de la Cuenta</legend>

        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario"
                   placeholder="Ingrese su usuario" maxlength="40" size="40">
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password"
                   placeholder="Ingrese su contraseña">
        </p>

        <p>
            <label for="confirmarPassword">Confirmar Password:</label>
            <input type="password" id="confirmarPassword"
                   name="confirmarPassword"
                   placeholder="Confirme su contraseña">
        </p>

    </fieldset>


    <fieldset>
        <legend>Tipo de Suscripción</legend>

        <p>
            <label for="servicio">Tipo de servicio:</label>

            <select id="servicio" name="servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
        </p>

        <p>
            Tema:

            <input type="checkbox" id="politica" name="tema" value="politica">
            <label for="politica">Política</label>

            <input type="checkbox" id="negocios" name="tema" value="negocios">
            <label for="negocios">Negocios</label>

            <input type="checkbox" id="tecnologia" name="tema" value="tecnologia">
            <label for="tecnologia">Tecnología</label>

            <input type="checkbox" id="salud" name="tema" value="salud">
            <label for="salud">Salud</label>
        </p>

        <p>
            <label for="comentario">Agregue un comentario:</label>

            <textarea id="comentario"
                      name="comentario"
                      rows="4"
                      cols="40"></textarea>
        </p>

    </fieldset>

    <p>
        <input type="submit" value="Enviar">
    </p>

</form>

</body>

</html>
