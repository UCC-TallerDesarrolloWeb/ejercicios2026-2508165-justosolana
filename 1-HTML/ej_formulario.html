<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>

    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>

    <form>

        <fieldset>

            <legend>Datos de usuario</legend>

            <p>
                Nombre:
                <input type="text"
                       name="nombre"
                       placeholder="Ingrese su nombre"
                       maxlength="40"
                       size="40">
            </p>

            <p>
                Apellido:
                <input type="text"
                       name="apellido"
                       placeholder="Ingrese su apellido"
                       maxlength="40"
                       size="40">
            </p>

            <p>
                Sexo:
                Masculino
                <input type="radio" name="sexo" value="masculino">

                Femenino
                <input type="radio" name="sexo" value="femenino">
            </p>

            <p>
                Edad:
                <input type="number"
                       name="edad"
                       placeholder="Edad"
                       maxlength="3">
            </p>

            <p>
                Email:
                <input type="email"
                       name="email"
                       placeholder="Ingrese su email"
                       maxlength="50">
            </p>

            <p>
                Usuario:
                <input type="text"
                       name="usuario"
                       placeholder="Ingrese su usuario"
                       maxlength="20"
                       size="40">
            </p>

            <p>
                Password:
                <input type="password"
                       name="password"
                       placeholder="Ingrese su contraseña"
                       maxlength="20">
            </p>

            <p>
                Confirmar Password:
                <input type="password"
                       name="confirmarPassword"
                       placeholder="Confirme su contraseña"
                       maxlength="20">
            </p>

            <p>
                Tipo de servicio:
                <select name="servicio">
                    <option value="free">Free</option>
                    <option value="standard">Standard</option>
                    <option value="premium">Premium</option>
                </select>
            </p>

            <p>
                Tema:

                Política
                <input type="checkbox" name="tema" value="politica">

                Negocios
                <input type="checkbox" name="tema" value="negocios">

                Tecnología
                <input type="checkbox" name="tema" value="tecnologia">

                Salud
                <input type="checkbox" name="tema" value="salud">
            </p>

            <p>
                Agregue un comentario:
                <textarea name="comentario" rows="4" cols="40"></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar">
            </p>

        </fieldset>

    </form>

</body>

</html>
